repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and import fixes
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: ty-check
        name: ty type check
        entry: uv run --locked ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

exclude: ^experiments/
